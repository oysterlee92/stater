<th:block th:replace="~{layouts/default :: html(
        ~{::section},
        'index',
        null
      )}">
    <section id="index">
        <p><i class="bi bi-house-door-fill text-primary" aria-hidden="true"></i>hello world!!!</p>
        <button id="open-example-popup" class="btn btn-primary" type="button">팝업 열기</button>

        <div class="template-modal">
            <div id="example-popup" class="card p-4 shadow" aria-labelledby="example-popup-title">
                <h2 id="example-popup-title" class="h5">팝업 예시</h2>
                <p>딤드와 열기·닫기 애니메이션이 적용된 팝업입니다.</p>
                <button id="close-example-popup" class="btn btn-secondary" type="button">닫기</button>
            </div>
        </div>
    </section>

</th:block>
